# Cal from the published image: ghcr.io/mihaipriboi/cal (built by the
# "Fork image" workflow). Copy this file and .env.example to the host:
#
#   cp .env.example .env && chmod 600 .env   # then fill it in
#   docker compose up -d
#
# Updating: `docker compose pull && docker compose up -d`. The image follows
# the `latest` tag, which moves only when the manual "Fork image" workflow is
# run on main, so nothing changes until you pull. To hold a version or roll
# back, set CAL_TAG to a sha-<commit> tag in .env. Old images: `docker image
# prune -f`. A dump before updating is cheap insurance:
#   docker compose exec -T db pg_dump -U cal -Fc cal > cal-$(date +%F).dump
# Volumes: cal-pg = database, cal-data = uploads, app backups and secret.key
# (the key for stored mail/CalDAV/GitHub credentials). Back up both: a
# database restore without secret.key loses those credentials.

services:
  cal:
    image: ghcr.io/mihaipriboi/cal:${CAL_TAG:-latest}
    environment:
      DATABASE_URL: postgres://cal:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/cal?sslmode=disable
      PORT: "8080"
      GIN_MODE: release
      SESSION_SECURE: "true"
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN, e.g. https://cal.example.com}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      MAIL_ALLOWED_NETS: ${MAIL_ALLOWED_NETS:-}
      TZ: ${TZ:-UTC}
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - cal-data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cal
      POSTGRES_USER: cal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - cal-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cal -d cal"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  cal-data:
  cal-pg:
