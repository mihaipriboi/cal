openapi: 3.1.0
info:
  title: Cal API
  version: 0.2.0
  description: Self-hosted minimal planner — entries, settings, holidays, cookie-session auth.
servers:
  - url: http://localhost:8080/api
paths:
  /health:
    get:
      responses:
        "200":
          description: API status
  /auth/config:
    get:
      description: Public auth state for the login screen — whether the instance has accounts and accepts new registrations. The first registered user becomes admin.
      responses:
        "200":
          description: Auth configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasUsers:
                    type: boolean
                  registrationOpen:
                    type: boolean
  /auth/register:
    post:
      description: Register an account. Always open while the instance has zero users (that account becomes admin); afterwards the admin-controlled allow_registration flag applies. Rate-limited to 8 attempts per minute per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "201":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          description: Registration closed by an admin
        "429":
          description: Too many attempts
  /auth/login:
    post:
      description: Log in. Rate-limited to 8 attempts per minute per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
        "429":
          description: Too many attempts
  /auth/logout:
    post:
      responses:
        "204":
          description: Session cleared
  /me:
    get:
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
  /admin/users:
    get:
      description: All accounts — admin only.
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          description: Not an admin
  /admin/users/{id}:
    patch:
      description: Set or clear a user's admin flag — admin only. The last admin cannot be demoted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isAdmin]
              properties:
                isAdmin:
                  type: boolean
      responses:
        "200":
          description: Updated flag
        "400":
          description: Last-admin guard
        "403":
          description: Not an admin
        "404":
          description: Unknown user
    delete:
      description: Delete an account and all its data — admin only. Cannot delete yourself or the last admin.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "400":
          description: Self-delete or last-admin guard
        "403":
          description: Not an admin
        "404":
          description: Unknown user
  /shopping/lists:
    get:
      description: Shopping lists with item/open counts.
      responses:
        "200":
          description: Lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShoppingList"
    post:
      description: Create a list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                icon:
                  type: string
                  description: Emoji or short label shown on the list chip.
      responses:
        "201":
          description: Created list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingList"
  /shopping/lists/{id}:
    get:
      description: Full list payload — sections and items.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Sections and items
          content:
            application/json:
              schema:
                type: object
                properties:
                  sections:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShoppingSection"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShoppingItem"
        "404":
          description: Unknown or foreign list
    patch:
      description: Rename/re-icon a list.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                icon:
                  type: string
      responses:
        "200":
          description: Updated list
        "404":
          description: Unknown or foreign list
    delete:
      description: Delete a list, its sections and items.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Unknown or foreign list
  /shopping/lists/{id}/sections:
    post:
      description: Add a section to a list.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Created section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingSection"
        "404":
          description: Unknown or foreign list
  /shopping/lists/{id}/items:
    post:
      description: Add an item; sectionId must belong to the same list.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                note:
                  type: string
                quantity:
                  type: string
                sectionId:
                  type: string
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingItem"
        "400":
          description: Bad input or foreign section
        "404":
          description: Unknown or foreign list
  /shopping/lists/{id}/clear:
    post:
      description: Delete every checked item on the list.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Count of removed items
        "404":
          description: Unknown or foreign list
  /shopping/sections/{id}:
    patch:
      description: Rename a section.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "204":
          description: Renamed
        "404":
          description: Unknown or foreign section
    delete:
      description: Delete a section; its items move to the unsectioned block.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Unknown or foreign section
  /shopping/sections/{id}/check:
    post:
      description: Check or uncheck every item in a section.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [checked]
              properties:
                checked:
                  type: boolean
      responses:
        "204":
          description: Applied
        "404":
          description: Unknown or foreign section
  /shopping/items/{id}:
    patch:
      description: Partial update — name, note, quantity, checked, uncertain, sectionId ("" = unsectioned), position.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                note:
                  type: string
                quantity:
                  type: string
                sectionId:
                  type: string
                checked:
                  type: boolean
                uncertain:
                  type: boolean
                position:
                  type: number
      responses:
        "200":
          description: Updated item
        "404":
          description: Unknown or foreign item
    delete:
      description: Remove an item.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Unknown or foreign item
  /shopping/suggest:
    get:
      description: Autocomplete — previously-used item names with their last section.
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Up to 10 suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    section:
                      type: string
  /admin/config:
    get:
      description: Instance access policy — admin only.
      responses:
        "200":
          description: Admin config
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowRegistration:
                    type: boolean
        "403":
          description: Not an admin
    put:
      description: Update instance access policy — admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allowRegistration]
              properties:
                allowRegistration:
                  type: boolean
      responses:
        "200":
          description: Saved config
        "403":
          description: Not an admin
  /entries:
    get:
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: q
          in: query
          description: Case-insensitive title/content match, or exact tag match. When set without a range, all dates are searched.
          schema:
            type: string
        - name: workspace
          in: query
          description: Workspace scope — uuid for one space, "none" for Personal only, absent for all.
          schema:
            type: string
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryInput"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "400":
          description: Invalid entry (bad date/time order, recur on non-task, missing title)
  /entries/{id}:
    patch:
      description: Partial update. Completing a recurring task spawns the next occurrence.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntryPatch"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Entry"
        "404":
          description: Not found
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /settings:
    get:
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
  /feeds:
    get:
      summary: List subscribed external calendar feeds
      responses:
        "200":
          description: Feeds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feed"
    post:
      summary: Subscribe to an iCalendar feed URL. The URL is fetched and validated immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                name:
                  type: string
                url:
                  type: string
                  format: uri
                color:
                  type: string
                  enum: [slate, mint, sky, violet, amber, orange, rose, red]
                  description: Omitted = the first colour no other feed uses
      responses:
        "201":
          description: Subscribed feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "400":
          description: Not a valid iCalendar feed
        "502":
          description: Feed URL could not be fetched
  /feeds/{id}:
    patch:
      summary: Rename and/or recolour a feed. Only name and color are accepted; the URL can't be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                color:
                  type: string
                  enum: [slate, mint, sky, violet, amber, orange, rose, red]
      responses:
        "200":
          description: Updated feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "400":
          description: Empty/long name, unknown colour, or a field other than name/color
        "404":
          description: Not the caller's feed
    delete:
      responses:
        "204":
          description: Feed removed
  /feeds/{id}/refresh:
    post:
      summary: Re-fetch the feed's ICS body now
      responses:
        "204":
          description: Refreshed
        "502":
          description: Feed URL could not be fetched
  /feed-events:
    get:
      summary: Expanded occurrences from all subscribed feeds in a date range (read-only)
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: External events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedEvent"
  /import:
    post:
      summary: Import a .ics file; each VEVENT becomes an `event` entry (recurring rules flatten to occurrences within ±1 year)
      requestBody:
        required: true
        content:
          text/calendar:
            schema:
              type: string
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
        "400":
          description: No events found
  /settings/widget-token:
    post:
      summary: Rotate the read-only widget share token
      responses:
        "200":
          description: New token
          content:
            application/json:
              schema:
                type: object
                properties:
                  widgetToken:
                    type: string
  /settings/api-token:
    post:
      summary: Rotate the MCP/API access token
      responses:
        "200":
          description: New token
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiToken:
                    type: string
  /settings/github-token:
    put:
      summary: Store the GitHub token (encrypted; never returned — settings only report githubConnected)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  maxLength: 255
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  githubConnected:
                    type: boolean
        "400":
          description: Empty or malformed token
    delete:
      summary: Remove the stored GitHub token
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  githubConnected:
                    type: boolean
  /widget/today:
    get:
      summary: Token-gated read-only agenda for the embeddable widget
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Today's entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Entry"
        "401":
          description: Invalid token
  /mcp:
    post:
      summary: "Model Context Protocol endpoint (JSON-RPC 2.0 over HTTP). Auth via `Authorization: Bearer <apiToken>`. Supports initialize, ping, tools/list, tools/call."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: JSON-RPC response
        "401":
          description: Invalid API token
  /caldav:
    get:
      summary: List connected CalDAV calendar accounts
      responses:
        "200":
          description: Accounts (passwords never leave the server)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CaldavAccount"
    post:
      summary: Connect a CalDAV collection (verified before saving; password AES-encrypted at rest)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                name:
                  type: string
                url:
                  type: string
                  description: Calendar collection URL
                username:
                  type: string
                password:
                  type: string
                color:
                  type: string
      responses:
        "201":
          description: Connected account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaldavAccount"
        "502":
          description: Could not reach or authenticate the server
  /caldav/test:
    post:
      summary: Probe credentials without saving
      responses:
        "204":
          description: Connection OK
        "502":
          description: Connection failed
  /caldav/{id}:
    delete:
      summary: Disconnect; synced entries are removed locally
      responses:
        "204":
          description: Removed
  /caldav/{id}/sync:
    post:
      summary: Force a two-way sync (push dirty changes, pull remote changes)
      responses:
        "204":
          description: Synced
        "502":
          description: Remote unreachable
  /settings/intake-token:
    post:
      summary: Rotate the create-only email intake token
      responses:
        "200":
          description: New token
          content:
            application/json:
              schema:
                type: object
                properties:
                  intakeToken:
                    type: string
  /settings/feed-token:
    post:
      summary: Rotate the read-only ICS feed token
      responses:
        "200":
          description: New token
          content:
            application/json:
              schema:
                type: object
                properties:
                  feedToken:
                    type: string
  /feed.ics:
    get:
      summary: Subscribable .ics feed of own tasks/events (feed token auth, settings.feedToken)
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: VCALENDAR of the user's tasks and events
          content:
            text/calendar:
              schema:
                type: string
        "401":
          description: Invalid token
  /restore:
    post:
      summary: Merge an export file back into the account (additive)
      description: Accepts the plain JSON manifest or the zip archive (detected by magic bytes). File rows restore when their binary is in the archive or an identical binary (sha256) is already stored. With `?dry=1` nothing is written — the response reports per-collection new/existing/orphaned counts instead.
      parameters:
        - name: dry
          in: query
          schema: { type: string, enum: ["1"] }
          description: Preview only — returns the dry-run report, writes nothing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entries:
                  type: array
                  items:
                    $ref: "#/components/schemas/Entry"
                people:
                  type: array
                  items:
                    type: object
                personLinks:
                  type: array
                  items:
                    type: object
                personTimeline:
                  type: array
                  items:
                    type: object
                files:
                  type: array
                  items:
                    $ref: "#/components/schemas/File"
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Counts of restored entries, people, links, timeline items, files (+ filesSkipped for manifest rows without binaries). With `?dry=1` returns `{dryRun: true, entries|people|links|timeline|files: {total, new, existing, invalid|orphaned|noBinary}}`.
  /sessions:
    get:
      summary: List active sessions
      responses:
        "200":
          description: Sessions (current flagged)
  /sessions/{id}:
    delete:
      summary: Revoke a session
      responses:
        "204":
          description: Revoked
  /password:
    post:
      summary: Change password; revokes other sessions
      responses:
        "204":
          description: Changed
        "403":
          description: Wrong current password
  /entries/{id}/revisions:
    get:
      summary: Point-in-time snapshots of an entry (newest first, ≤50)
      responses:
        "200":
          description: Revision list
  /entries/{id}/restore/{rev}:
    post:
      summary: Restore a revision onto the entry (snapshots current state first)
      responses:
        "204":
          description: Restored
        "404":
          description: Revision not found
  /review/week:
    get:
      summary: Weekly digest — done/slipped/notes/streak/busiest
      responses:
        "200":
          description: WeekReview
  /habits:
    get:
      summary: Streaks for recurring #habit-tagged tasks
      responses:
        "200":
          description: Habit list with streak counts
  /unfurl:
    get:
      summary: Fetch a link's title/description/favicon (SSRF-guarded)
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Page metadata
        "400":
          description: Invalid or private URL
  /youtube/search:
    get:
      summary: Search YouTube via the user's Invidious instance (settings.invidiousUrl)
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Video results (≤24; url/thumbnail point at youtube.com/i.ytimg.com)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    videoId:
                      type: string
                    title:
                      type: string
                    author:
                      type: string
                    url:
                      type: string
                    thumbnail:
                      type: string
                    seconds:
                      type: integer
                    views:
                      type: integer
        "400":
          description: No Invidious instance configured
        "502":
          description: Instance unreachable or bad response
  /files:
    post:
      summary: Upload an attachment (≤20 MB, multipart 'file')
      responses:
        "200":
          description: "{url, name, markdown} — markdown is a ![alt](url) snippet"
  /files:
    get:
      summary: List uploaded files
    post:
      summary: Upload a file (multipart, 20 MB, quota-enforced; optional personId attaches to a person)
  /files/{id}:
    delete:
      summary: Delete a file
  /files/{id}/share:
    post:
      summary: Toggle a public share token {on}
  /shared/files/{token}:
    get:
      summary: Public share download (no auth)
  /boards:
    get:
      summary: List kanban boards
    post:
      summary: Create a board
  /boards/{id}/view:
    get:
      summary: Board columns + cards
  /boards/{id}/columns:
    post:
      summary: Add a column
  /columns/{id}:
    patch:
      summary: Rename a column
    delete:
      summary: Delete a column
  /cards/{id}/move:
    post:
      summary: Move card to column at fractional position
  /timer/start:
    post:
      summary: Start the running focus timer {entryId?, note?}
  /timer/stop:
    post:
      summary: Stop the running timer
  /timer/current:
    get:
      summary: Running timer or 204
  /time/summary:
    get:
      summary: todayMinutes, weekMinutes, perEntry
  /time/log:
    get:
      summary: Timesheet entries (from/to optional)
    post:
      summary: Manual time entry {entryId?, note?, startAt, endAt?, planned?, billable?, rate?, projectId?, tags?}
  /time/log/{id}:
    patch:
      summary: Edit a logged session — explicit null clears endAt/rate/projectId/entryId/planned
    delete:
      summary: Delete a session
  /time/export:
    get:
      summary: Timesheet export ?format=csv|json
  /dashboard:
    get:
      summary: Today widgets — counts, deadlines, weekly activity, merged feed, timer
      parameters:
        - name: workspace
          in: query
          schema:
            type: string
  /workspaces:
    get:
      summary: User's workspaces
    post:
      summary: Create workspace {name, color?, icon?}
  /workspaces/{id}:
    patch:
      summary: Update workspace {name?, color?, icon?, position?}
    delete:
      summary: Delete workspace — contents fall back to Personal
  /people:
    get:
      summary: >-
        Personal relationship records — names, relations, birthdays, named
        dates, contact fields, tags, custom fields, links, favorites
    post:
      summary: >-
        Create person {name, relation?, nickname?, birthday?, birthdayRemind?,
        dates? [{label,date,remindDays?}], notes?, color?, workspaceId?,
        phone?, email?, address?, giftIdeas?, interests?, isFavorite?,
        fields? [{key,value}], links? [{platform,url}], tags?}
      responses:
        "400":
          description: Invalid person (missing name, bad date, unknown workspace)
  /people/relations:
    get:
      summary: Every person→person link in the account (family-tree view)
  /people/relations/{linkId}:
    delete:
      summary: Remove a person link by id
  /people/share:
    post:
      summary: Enable/disable the public people page {on}; returns shareToken
      responses:
        "200":
          description: shareToken when enabled — page at /people/shared/<token>, ICS at /api/shared/people/<token>/calendar.ics
  /shared/people/{token}:
    get:
      summary: Public people list — names, relations, birthdays, named dates only (no auth)
      responses:
        "404":
          description: Revoked or unknown token
  /shared/people/{token}/calendar.ics:
    get:
      summary: The same dates as a yearly-recurring subscribable ICS feed (no auth)
      responses:
        "404":
          description: Revoked or unknown token
  /people/{id}:
    get:
      summary: One person by id
      responses:
        "404":
          description: Not found
    patch:
      summary: Update person — full replace of the editable record
      responses:
        "404":
          description: Not found
    delete:
      summary: Delete person — permanent, no trash
      responses:
        "404":
          description: Not found
  /people/{id}/relations:
    get:
      summary: Links touching this person (both directions, names resolved)
    post:
      summary: >-
        Link to another person {toId, kind} — kind in
        parent|child|sibling|partner|friend|coworker|mentor; edge reads
        "to is from's kind"
      responses:
        "409":
          description: Link already exists
  /people/{id}/timeline:
    get:
      summary: Chronological history (met, gift, trip, achievement, memory, note)
    post:
      summary: Add timeline item {type, title, body?, occurredOn?}
  /people/{id}/timeline/{itemId}:
    patch:
      summary: Update a timeline item {type, title, body?, occurredOn?}
    delete:
      summary: Delete a timeline item
  /people/{id}/files:
    get:
      summary: Attachments uploaded with personId — photos, documents
  /namedays/search:
    get:
      summary: Nameday lookup — ?name=ada&country=cz (abalin V2 + CSV fallback)
  /namedays/date:
    get:
      summary: Names celebrated on ?month=&day= per country
  /namedays/countries:
    get:
      summary: Country codes with nameday data
  /holidays/browse:
    get:
      summary: date.nager.at public holidays — ?country=US&year=2026
  /holidays/browse/countries:
    get:
      summary: ~150 country codes supported by the holiday browse
  /holidays/import:
    post:
      summary: Import a country's year of public holidays as yearly entries {country, year}
  /carddav/{id}/import-people:
    post:
      summary: Create people from a saved addressbook's contacts (skips existing names)
  /auth/forgot:
    post:
      summary: >-
        Password reset request {email} — always 204; mails a one-hour
        single-use link via the user's configured SMTP account
  /auth/reset:
    post:
      summary: Consume a reset token {token, password} — revokes all sessions
  /files/{id}:
    patch:
      summary: Update file tags/workspace {tags?, workspaceId?}
  /filters:
    get:
      summary: Saved filters
    post:
      summary: Create saved filter {name, filter}
  /filters/{id}:
    delete:
      summary: Delete a saved filter
  /entries/{id}/refresh-link:
    post:
      summary: Re-fetch unfurl/oEmbed metadata for a link entry
  /mail/accounts:
    get:
      summary: Mail accounts (no passwords)
    post:
      summary: >-
        Connect an IMAP/SMTP account — {name?, email, imapHost, imapPort?,
        smtpHost, smtpPort?, username?, password, insecure?}. Password stored
        AES-256-GCM; `insecure` skips TLS verification (self-hosted mail).
  /mail/accounts/{id}:
    delete:
      summary: Remove a mail account
  /mail/accounts/{id}/test:
    post:
      summary: Verify IMAP login + SMTP auth
  /mail/{id}/mailboxes:
    get:
      summary: IMAP mailboxes for an account
  /mail/{id}/messages:
    get:
      summary: Envelope page — ?mailbox=INBOX&page=0 (40/page, newest first)
  /mail/{id}/message/{uid}:
    get:
      summary: Message body (text + sanitized html)
    delete:
      summary: Move to Trash (or \Deleted+EXPUNGE fallback)
  /mail/{id}/message/{uid}/flag:
    post:
      summary: Set/clear \\Seen {seen}
  /mail/{id}/send:
    post:
      summary: Send via the account's SMTP {to, cc?, subject, text}
  /entries/{id}/activity:
    get:
      summary: Card activity log
  /trash:
    get:
      summary: Soft-deleted entries
  /trash/{id}/restore:
    post:
      summary: Restore a trashed entry
  /trash/{id}:
    delete:
      summary: Purge a trashed entry permanently
  /boards/{id}/share:
    post:
      summary: Toggle a public board share token {on}
  /shared/boards/{token}:
    get:
      summary: Public board columns + cards (no auth)
  /tags:
    get:
      summary: Tag -> entry count map
  /agenda:
    get:
      summary: Markdown agenda for ?days=N (1-60)
  /time/log:
    get:
      summary: Finished sessions in ?from&to
  /time/log/{id}:
    delete:
      summary: Delete a session
  /time/export:
    get:
      summary: solidtime-shaped CSV or JSON (?format=) of sessions
  /search:
    get:
      summary: Global search — entries + files + boards + people
  /github/inbox:
    get:
      summary: Open issues+PRs involving the user (needs a token set via /settings/github-token)
  /github/activity:
    get:
      summary: Login + events this week
  /github/import:
    post:
      summary: Import an issue/PR url as a board card {url, boardId?, columnId?}
  /activity:
    get:
      summary: Date -> entry count map, last 120 days
  /files/{name}:
    get:
      summary: Serve a caller-owned attachment
      responses:
        "200":
          description: File bytes
        "404":
          description: Not found / not owned
  /webhooks:
    get:
      summary: List outbound webhooks
    post:
      summary: Register a webhook (HMAC secret returned)
      responses:
        "201":
          description: Created
  /webhooks/{id}:
    delete:
      summary: Remove a webhook
  /intake:
    post:
      summary: "Email-to-task intake — {subject, text?, date?} → task"
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: "Intake token (settings.intakeToken; create-only). May be sent as `Authorization: Bearer` instead."
      responses:
        "201":
          description: Task created
  /caldav/discover:
    post:
      summary: List calendar collections under a base URL (principal → home-set)
      responses:
        "200":
          description: "[{href, name}]"
  /carddav:
    get:
      summary: Saved CardDAV addressbooks (no secrets)
    post:
      summary: Connect an addressbook and import BDAY contacts as yearly events
      responses:
        "201":
          description: "{imported, found}"
  /carddav/{id}/sync:
    post:
      summary: Re-pull birthdays for a CardDAV account
  /carddav/{id}:
    delete:
      summary: Disconnect a CardDAV account
  /google/connect:
    get:
      summary: Google OAuth consent URL (requires GOOGLE_CLIENT_ID/SECRET env)
      responses:
        "200":
          description: "{url}"
        "501":
          description: Not configured
  /google/callback:
    get:
      summary: OAuth redirect — exchanges code, stores tokens, syncs, redirects to /settings
  /google/status:
    get:
      summary: "{connected: bool}"
  /google/sync:
    post:
      summary: Force a Google Calendar sync
  /google:
    delete:
      summary: Disconnect Google (removes tokens + synthetic feed)
  /push/subscriptions:
    get:
      summary: List push devices (label + endpoint tail)
    responses:
      "200":
        description: devices
  /push/subscriptions/{id}:
    delete:
      summary: Revoke one device
  /push/vapid:
    get:
      responses:
        "200":
          description: VAPID public key for pushManager.subscribe
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicKey:
                    type: string
  /push/subscribe:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint:
                  type: string
                keys:
                  type: object
                  properties:
                    p256dh:
                      type: string
                    auth:
                      type: string
      responses:
        "204":
          description: Subscription stored
  /push/unsubscribe:
    post:
      responses:
        "204":
          description: Subscription removed
  /export:
    get:
      summary: Download all user data (JSON manifest, or zip with upload binaries)
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [zip]
          description: "zip returns application/zip: cal-export.json manifest + files/<name> binaries"
      responses:
        "200":
          description: Full export (user, settings, entries, people + personLinks + personTimeline + files)
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportedAt:
                    type: string
                    format: date-time
                  user:
                    $ref: "#/components/schemas/User"
                  settings:
                    $ref: "#/components/schemas/Settings"
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Entry"
                  people:
                    type: array
                    items:
                      type: object
                  personLinks:
                    type: array
                    items:
                      type: object
                  personTimeline:
                    type: array
                    items:
                      type: object
                  files:
                    type: array
                    items:
                      $ref: "#/components/schemas/File"
            application/zip:
              schema:
                type: string
                format: binary
  /holidays:
    get:
      parameters:
        - name: country
          in: query
          required: true
          schema:
            type: string
        - name: year
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Holidays for the country/year
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Holiday"
        "400":
          description: Unknown country or invalid year
  /holidays/countries:
    get:
      responses:
        "200":
          description: Supported holiday regions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Country"
components:
  schemas:
    AuthRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
        isAdmin:
          type: boolean
          description: Instance administrator — first registered user.
        createdAt:
          type: string
          format: date-time
    ShoppingList:
      type: object
      required: [id, name, icon, position, items, open, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        icon:
          type: string
        position:
          type: number
        items:
          type: integer
        open:
          type: integer
        createdAt:
          type: string
          format: date-time
    ShoppingSection:
      type: object
      required: [id, listId, name, position]
      properties:
        id:
          type: string
        listId:
          type: string
        name:
          type: string
        position:
          type: number
    ShoppingItem:
      type: object
      required: [id, listId, name, note, quantity, checked, uncertain, position, createdAt]
      properties:
        id:
          type: string
        listId:
          type: string
        sectionId:
          type: string
        name:
          type: string
        note:
          type: string
        quantity:
          type: string
        checked:
          type: boolean
        uncertain:
          type: boolean
          description: '"Can''t find it" flag from the store.'
        position:
          type: number
        createdAt:
          type: string
          format: date-time
        checkedAt:
          type: string
          format: date-time
    Entry:
      type: object
      required: [id, title, type, date, completed, color, tags, recur, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        type:
          enum: [task, note, link, event]
        linkUrl:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: HH:MM 24h; absent for untimed/all-day entries
        endTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
          description: Must be after startTime when both are set
        completed:
          type: boolean
        color:
          type: string
        tags:
          type: array
          items:
            type: string
        recur:
          enum: [none, daily, weekly, monthly, yearly]
        remind:
          type: integer
          description: Minutes before startTime to fire a reminder; absent = none
        createdAt:
          type: string
          format: date-time
    EntryInput:
      type: object
      required: [title, type, date]
      properties:
        title:
          type: string
        content:
          type: string
        type:
          enum: [task, note, link, event]
        linkUrl:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        endTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        color:
          type: string
        tags:
          type: array
          items:
            type: string
        recur:
          enum: [none, daily, weekly, monthly, yearly]
          description: Only valid for type=task
        remind:
          type: integer
          nullable: true
    EntryPatch:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        type:
          enum: [task, note, link, event]
        linkUrl:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        completed:
          type: boolean
        color:
          type: string
        tags:
          type: array
          items:
            type: string
        recur:
          enum: [none, daily, weekly, monthly, yearly]
        remind:
          type: integer
          nullable: true
    Settings:
      type: object
      required: [country, showHolidays, theme, weekStart]
      properties:
        country:
          type: string
        showHolidays:
          type: boolean
        theme:
          enum: [light, dark, system]
        weekStart:
          enum: [monday, sunday]
        accent:
          enum: [green, blue, violet, amber, rose]
        widgetToken:
          type: string
          description: Read-only token for the embeddable Today widget
        apiToken:
          type: string
          description: Full-access bearer token for the MCP endpoint
        intakeToken:
          type: string
          description: Create-only token for /intake
        feedToken:
          type: string
          description: Read-only token for /feed.ics
        githubConnected:
          type: boolean
          description: A GitHub token is stored (the token itself is write-only)
        githubCloseIssues:
          type: boolean
          description: Completing a card closes its linked GitHub issue
        defaultView:
          enum: [month, week, day]
          description: Calendar view fresh devices open on (default month)
        invidiousUrl:
          type: string
          description: Base URL of the user's Invidious instance for YouTube search (empty = off)
    File:
      type: object
      required: [id, name, origName, size, mime]
      properties:
        id:
          type: string
        name:
          type: string
          description: Server-side random name on disk
        origName:
          type: string
          description: Client filename for display
        size:
          type: integer
        mime:
          type: string
        shareToken:
          type: string
        createdAt:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
        workspaceId:
          type: string
        personId:
          type: string
          description: Set when attached to a person profile
        sha256:
          type: string
          description: Content hash — uploads/restore dedupe identical binaries
    Feed:
      type: object
      required: [id, name, url, color]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        color:
          type: string
        fetchedAt:
          type: string
          format: date-time
    CaldavAccount:
      type: object
      required: [id, name, url, username, color]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        username:
          type: string
        color:
          type: string
        lastSynced:
          type: string
          format: date-time
    FeedEvent:
      type: object
      required: [id, feedId, feedName, title, date, color]
      properties:
        id:
          type: string
        feedId:
          type: string
        feedName:
          type: string
        title:
          type: string
        date:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        color:
          type: string
        location:
          type: string
        url:
          type: string
        details:
          type: string
    Holiday:
      type: object
      required: [id, name, date, country]
      properties:
        id:
          type: string
        name:
          type: string
        date:
          type: string
          format: date
        country:
          type: string
    Country:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
