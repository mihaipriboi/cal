name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - run: go vet ./...
        working-directory: apps/api
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        working-directory: apps/api
      - run: go test ./...
        working-directory: apps/api

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      # Headless variant compiles without webkit headers; wails build is
      # a release step, not CI.
      - run: go vet -tags headless ./...
        working-directory: apps/desktop
      - run: go build -tags headless ./...
        working-directory: apps/desktop

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build all-in-one image
        run: docker build -t cal:ci .
      - name: Smoke test — embedded Postgres, SPA, register roundtrip
        run: |
          docker run -d --name cal -p 8080:8080 cal:ci
          for i in $(seq 1 120); do
            curl -fsS http://localhost:8080/api/health && break || sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -qi "html"
          curl -fsS -c /tmp/jar -H 'Content-Type: application/json' \
            -d '{"email":"ci@cal.local","password":"ci-password-123"}' \
            http://localhost:8080/api/auth/register
          curl -fsS -b /tmp/jar http://localhost:8080/api/me | grep -q "ci@cal.local"
          docker rm -f cal
