name: Release

# Fork: manual only. This fork publishes its container image with
# fork-image.yml and doesn't cut upstream-style releases automatically.
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  # Keep in sync with github.com/wailsapp/wails/v2 in apps/desktop/go.mod.
  WAILS_VERSION: v2.16.0

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, ext: "", label: linux-amd64 }
          - { os: windows-latest, ext: ".exe", label: windows-amd64 }
          - { os: macos-latest, ext: "", label: macos-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      # Signing is opt-in: the steps below run only when the secrets exist.
      # See docs/releasing.md for what each secret is and how to produce it.
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: npm ci

      - name: Resolve version
        working-directory: apps/desktop
        shell: bash
        # Tag pushes give "v1.2.3" → "1.2.3"; workflow_dispatch on a branch
        # falls back to wails.json productVersion.
        run: |
          V="${GITHUB_REF_NAME#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || V=$(node -p "require('./wails.json').info.productVersion")
          echo "VERSION=$V" >> "$GITHUB_ENV"
          # A tag pushed without a version-bump commit leaves productVersion
          # stale — sync it so installers and About dialogs report the tag.
          node -e "const j=require('./wails.json');j.info.productVersion='$V';require('fs').writeFileSync('wails.json',JSON.stringify(j,null,2)+'\n')"

      - name: Webkit deps (Linux)
        if: runner.os == 'Linux'
        # desktop-file-utils provides desktop-file-validate — appimagetool
        # refuses to package without it.
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev desktop-file-utils

      - name: Install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        # choco installs to Program Files but does not put makensis on PATH —
        # without this wails only warns "Cannot create installer" and moves on.
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Bundled runtime must exist before `wails build -nsis` runs makensis —
      # project.nsi File /r's it into the installer. It makes first launch
      # fully offline and hides every postgres console window.
      - name: Bundle Postgres runtime (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: node scripts/prepare-pg-runtime.mjs windows amd64 build/windows/installer/pg-runtime

      - name: Build desktop app
        working-directory: apps/desktop
        # webkit2_41 tag: Ubuntu 24.04+ ships webkit2gtk-4.1 only.
        # -installscope user: per-user install in %LOCALAPPDATA%\Programs —
        # no UAC prompt, no admin needed (VS Code/Discord model).
        # darwin/universal: one DMG covering Apple Silicon + Intel.
        run: wails build -clean ${{ runner.os == 'Linux' && '-tags webkit2_41' || '' }} ${{ runner.os == 'Windows' && '-nsis -installscope user' || '' }} ${{ runner.os == 'macOS' && '-platform darwin/universal' || '' }}

      - name: Build headless server binary
        working-directory: apps/desktop
        run: go build -tags headless -o build/bin/cal-server${{ matrix.ext }} .

      - name: Install nfpm (Linux)
        if: runner.os == 'Linux'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3

      # windows-latest ships signtool via the bundled Windows SDK. cal.exe is
      # signed before packaging; the NSIS installer and MSI are signed after.
      # The bare cal.exe is deliberately NOT shipped — the NSIS setup exe is
      # the user-facing artifact.
      - name: Sign & package (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            [IO.File]::WriteAllBytes("$PWD/cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD build/bin/cal.exe
          }
          # `wails build -nsis` emits "<name>-<arch>-installer.exe" — discover it
          # rather than hard-code the name, and fail loudly if it never ran
          # (wails only warns when makensis is missing).
          $installer = Get-ChildItem build/bin -Filter "*-installer.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated — check the wails build step" }
          Move-Item $installer.FullName "build/bin/Cal-Setup-Windows.exe"
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD "build/bin/Cal-Setup-Windows.exe"
          }
          # v7 requires accepting the OSMF EULA; v6 does not.
          dotnet tool install --global wix --version 6.0.2
          Copy-Item -Recurse build/windows/installer/pg-runtime build/bin/pg-runtime
          wix build build/windows/cal.wxs -arch x64 -d "BinDir=$PWD/build/bin" -d "ProductVersion=$env:VERSION" -o "build/bin/Cal-Windows.msi"
          Remove-Item build/bin/*.wixpdb
          if ($env:WINDOWS_CERT_PFX_BASE64) {
            signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD "build/bin/Cal-Windows.msi"
            Remove-Item cert.pfx
          }
          Move-Item build/bin/cal-server.exe "build/bin/cal-server-${{ matrix.label }}.exe"

      # Developer ID Application cert → codesign, then notarize + staple so
      # Gatekeeper opens the app without the right-click dance.
      - name: Sign & notarize (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12_BASE64 != ''
        working-directory: apps/desktop/build/bin
        run: |
          set -euo pipefail
          KEYCHAIN=build-sign.keychain-db
          security create-keychain -p "" $KEYCHAIN
          security set-keychain-settings $KEYCHAIN
          security unlock-keychain -p "" $KEYCHAIN
          echo "$APPLE_CERT_P12_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k $KEYCHAIN -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" $KEYCHAIN
          security list-keychains -d user -s $KEYCHAIN $(security list-keychains -d user | tr -d '"')
          rm cert.p12
          IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
          codesign --deep --force --options runtime --timestamp --sign "$IDENTITY" cal.app
          ditto -c -k --keepParent cal.app cal-notarize.zip
          xcrun notarytool submit cal-notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple cal.app
          rm cal-notarize.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          nfpm package -f build/linux/nfpm.yaml -p deb -t "build/bin/Cal-Linux.deb"
          nfpm package -f build/linux/nfpm.yaml -p rpm -t "build/bin/Cal-Linux.rpm"
          # AppImage: linuxdeploy + gtk plugin bundles GTK + WebKit so the
          # image is self-contained on any distro (a bare AppRun wrapper only
          # works where webkit2gtk already happens to be installed).
          # --appimage-extract sidesteps the missing FUSE on GH runners.
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O /tmp/linuxdeploy
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh -O /tmp/linuxdeploy-plugin-gtk.sh
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/linuxdeploy /tmp/linuxdeploy-plugin-gtk.sh /tmp/appimagetool
          mkdir /tmp/ld /tmp/at
          (cd /tmp/ld && /tmp/linuxdeploy --appimage-extract >/dev/null)
          (cd /tmp/at && /tmp/appimagetool --appimage-extract >/dev/null)
          export PATH="/tmp:$PATH"  # linuxdeploy finds the gtk plugin on PATH
          mkdir -p build/bin/AppDir/usr/bin build/bin/AppDir/usr/share/applications build/bin/AppDir/usr/share/icons/hicolor/512x512/apps
          install -m755 build/bin/cal build/bin/AppDir/usr/bin/
          install -m644 build/linux/cal.desktop build/bin/AppDir/usr/share/applications/
          install -m644 build/linux/cal.png build/bin/AppDir/usr/share/icons/hicolor/512x512/apps/
          DEPLOY_GTK_VERSION=3 /tmp/ld/squashfs-root/AppRun --appdir build/bin/AppDir --plugin gtk \
            -d build/bin/AppDir/usr/share/applications/cal.desktop \
            -i build/bin/AppDir/usr/share/icons/hicolor/512x512/apps/cal.png
          # linuxdeploy scans the main binary's NEEDED libs but not webkit's
          # out-of-process helpers — without these the webview renders blank.
          WEBKIT_LIBEXEC=$(dirname "$(find /usr/lib -name WebKitWebProcess | head -1)")
          cp -r "$WEBKIT_LIBEXEC" build/bin/AppDir/usr/lib/
          mkdir -p build/bin/AppDir/apprun-hooks
          printf 'export WEBKIT_EXEC_PATH="$APPDIR/usr/lib/%s"\nexport WEBKIT_INJECTED_BUNDLE_PATH="$APPDIR/usr/lib/%s/injected-bundle"\n' \
            "$(basename "$WEBKIT_LIBEXEC")" "$(basename "$WEBKIT_LIBEXEC")" \
            > build/bin/AppDir/apprun-hooks/webkit-exec-path.sh
          ARCH=x86_64 /tmp/at/squashfs-root/usr/bin/appimagetool build/bin/AppDir "build/bin/Cal-Linux.AppImage"
          # headless server ships as a bare binary
          mv "build/bin/cal-server${{ matrix.ext }}" "build/bin/cal-server-${{ matrix.label }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop/build/bin
        run: |
          hdiutil create -volname Cal -srcfolder cal.app -ov -format UDZO "Cal-macOS.dmg"
          mv cal-server "cal-server-${{ matrix.label }}"

      - uses: actions/upload-artifact@v7
        with:
          name: cal-${{ matrix.label }}
          path: |
            apps/desktop/build/bin/Cal-*
            apps/desktop/build/bin/cal-*

      # body_path gives the release a pick-your-platform table;
      # generate_release_notes appends the auto changelog below it.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: |
            apps/desktop/build/bin/Cal-*
            apps/desktop/build/bin/cal-*
